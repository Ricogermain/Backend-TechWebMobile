name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma lit DIRECT_URL dans prisma.config.ts, même pendant la génération.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/driveo_ci?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/driveo_ci?schema=public
      JWT_SECRET: ci-only-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
